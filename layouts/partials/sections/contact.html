{{ $headless := .Site.GetPage "/sections" }}
{{ $contact := $headless.Resources.GetMatch (printf "*%s*" "contact") }}

<div id="contact" class="w-full min-h-screen flex flex-col justify-center items-center py-12">
    <div class="self-center text-center w-full sm:w-2/3 xl:w-1/2 px-4 sm:px-0">
        <h2 class="font-bold tracking-wider text-gray-800 text-4xl mb-4">{{ $contact.Title }}</h2>
        <div class="font-light text-black text-xl">
            {{ $contact.Content }}
        </div>
    </div>
</div>
